<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alan Cabrera · Sudamericano FESUPO Chile 2026</title>
<style>
  @font-face { font-family: 'Big Shoulders Display'; font-weight: 800; src: url(tipografias/BigShouldersDisplay-800.ttf); }
  @font-face { font-family: 'Big Shoulders Display'; font-weight: 900; src: url(tipografias/BigShouldersDisplay-900.ttf); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 500; src: url(tipografias/BarlowCondensed-500.ttf); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url(tipografias/BarlowCondensed-600.ttf); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(tipografias/BarlowCondensed-700.ttf); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: italic; src: url(tipografias/BarlowCondensed-700i.ttf); }

  :root {
    --tinta: #05080f;
    --acero: #8e9cb8;
    --rojo: #e11d2e;
    --azul: #2352c8;
    --amarillo: #f4c21b;
    --verde: #1f9e58;
    --blanco: #f5f7fb;
    --margen: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--tinta); }

  .post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: var(--tinta); color: var(--blanco);
    font-family: 'Barlow Condensed', sans-serif;
  }
  .capa { position: absolute; inset: 0; }

  /* Fondo: la plataforma a oscuras y un solo foco sobre el atleta */
  .fondo {
    background:
      radial-gradient(ellipse 520px 480px at 540px 470px, rgba(46, 86, 180, .40), transparent 72%),
      radial-gradient(ellipse 900px 460px at 540px 1350px, rgba(225, 29, 46, .10), transparent 70%),
      linear-gradient(180deg, #070b16, var(--tinta));
  }
  .foco { filter: blur(22px); }
  .foco::before {
    content: ''; position: absolute; left: 170px; top: -60px; width: 740px; height: 1000px;
    clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, rgba(190, 210, 255, .15), rgba(190, 210, 255, 0) 78%);
  }

  .cifra {
    position: absolute; left: 0; right: 0; top: 262px; text-align: center;
    font: 900 620px/.8 'Big Shoulders Display'; letter-spacing: -.01em;
    background: linear-gradient(180deg, rgba(142, 156, 184, .16), rgba(142, 156, 184, 0) 82%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-stroke: 2px rgba(142, 156, 184, .26);
  }

  .atleta {
    position: absolute; left: 240px; top: 204px; width: 630px;
    -webkit-mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
    filter: drop-shadow(0 0 26px rgba(90, 130, 230, .2)) drop-shadow(0 24px 40px rgba(0, 0, 0, .55));
  }

  .velo { background: linear-gradient(180deg, transparent 56%, rgba(5, 8, 15, .82) 67%, var(--tinta) 76%); }

  .grano { opacity: .09; mix-blend-mode: overlay; }

  /* Cabecera */
  .cabecera {
    position: absolute; left: var(--margen); right: var(--margen); top: 56px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .insignia {
    width: 164px; height: 164px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .06), 0 18px 40px rgba(0, 0, 0, .45);
  }
  .insignia img { display: block; width: 100%; height: 100%; }
  .sudamericano { display: block; height: 176px; margin-right: -6px; }

  /* Ficha */
  .ficha { position: absolute; left: var(--margen); right: var(--margen); bottom: 56px; }

  .aviso {
    display: inline-block; padding: 7px 16px 6px; background: var(--rojo);
    font: 800 34px/1 'Barlow Condensed'; font-weight: 700; letter-spacing: .14em;
  }
  .nombre {
    display: block; white-space: nowrap; margin-top: 14px;
    font: 900 160px/.84 'Big Shoulders Display'; letter-spacing: .005em;
  }
  .nombre span {
    display: inline-block;
    background: linear-gradient(180deg, #fff 35%, #d3dbea);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .categoria { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  .categoria .peso, .categoria .division {
    padding: 8px 16px 7px; font: 700 32px/1 'Barlow Condensed'; letter-spacing: .08em;
  }
  .categoria .peso { background: var(--blanco); color: var(--tinta); }
  .categoria .division { box-shadow: inset 0 0 0 2px var(--blanco); }
  .categoria .evento {
    margin-left: auto; font: 600 22px/1 'Barlow Condensed'; letter-spacing: .2em; color: var(--acero);
  }

  /* Divisor: una barra cargada */
  .barra { display: flex; align-items: center; gap: 3px; height: 40px; margin-top: 28px; }
  .barra .eje { flex: 1; height: 3px; border-radius: 2px; background: rgba(200, 208, 224, .38); }
  .barra .disco { width: 8px; border-radius: 2px; }
  .barra .rojo { height: 40px; background: var(--rojo); }
  .barra .azul { height: 40px; background: var(--azul); }
  .barra .amarillo { height: 35px; background: var(--amarillo); }
  .barra .verde { height: 29px; background: var(--verde); }
  .barra .collarin { width: 6px; height: 16px; border-radius: 1px; background: #c9cfdb; }
  .barra .manga { width: 14px; height: 8px; border-radius: 1px; background: #8f98ab; }

  .horarios { display: grid; grid-template-columns: 1fr 1fr; margin-top: 26px; }
  .hora { display: grid; grid-template-columns: auto 1fr; column-gap: 22px; row-gap: 12px; align-items: center; }
  .hora + .hora { padding-left: 44px; border-left: 1px solid rgba(142, 156, 184, .28); }
  .bandera { grid-row: span 2; width: 54px; height: 36px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .2); }
  .hora .cifras { font: 900 100px/.78 'Big Shoulders Display'; }
  .hora .cifras span { margin-left: 8px; font: 700 38px/1 'Barlow Condensed'; color: var(--rojo); letter-spacing: .04em; }
  .hora small { font: 600 22px/1 'Barlow Condensed'; letter-spacing: .24em; color: var(--acero); }

  .deseo {
    display: flex; align-items: center; gap: 18px; margin-top: 34px;
    font: italic 700 34px/1.1 'Barlow Condensed';
  }
  .luces { display: inline-flex; gap: 10px; }
  .luces i {
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 0 14px rgba(255, 255, 255, .7);
  }
</style>
</head>
<body>
<main class="post">
  <div class="capa fondo"></div>
  <div class="capa foco"></div>
  <div class="cifra" aria-hidden="true">−83</div>
  <img class="atleta" src="activos/atleta.png" alt="Alan Cabrera">
  <div class="capa velo"></div>

  <header class="cabecera">
    <div class="insignia"><img src="activos/lipoa.png" alt="LIPOA · Liga de Levantamiento de Potencia del Atlántico"></div>
    <img class="sudamericano" src="activos/sudamericano.png" alt="South American FESUPO Championships · Chile 2026">
  </header>

  <section class="ficha">
    <div class="aviso">MAÑANA COMPITE</div>
    <h1 class="nombre"><span>ALAN CABRERA</span></h1>

    <div class="categoria">
      <span class="peso">−83 KG</span>
      <span class="division">SUB JUNIOR</span>
      <span class="evento">SUDAMERICANO FESUPO · CHILE 2026</span>
    </div>

    <div class="barra" aria-hidden="true">
      <i class="manga"></i><i class="collarin"></i>
      <i class="disco verde"></i><i class="disco amarillo"></i><i class="disco azul"></i><i class="disco rojo"></i>
      <i class="collarin"></i><i class="eje"></i><i class="collarin"></i>
      <i class="disco rojo"></i><i class="disco azul"></i><i class="disco amarillo"></i><i class="disco verde"></i>
      <i class="collarin"></i><i class="manga"></i>
    </div>

    <div class="horarios">
      <div class="hora">
        <svg class="bandera" viewBox="0 0 60 40" aria-label="Colombia">
          <rect width="60" height="20" fill="#fcd116"/><rect y="20" width="60" height="10" fill="#003893"/><rect y="30" width="60" height="10" fill="#ce1126"/>
        </svg>
        <div class="cifras">11:00<span>AM</span></div>
        <small>HORA COLOMBIA</small>
      </div>
      <div class="hora">
        <svg class="bandera" viewBox="0 0 60 40" aria-label="Chile">
          <rect width="60" height="20" fill="#fff"/><rect y="20" width="60" height="20" fill="#d52b1e"/><rect width="20" height="20" fill="#0039a6"/>
          <polygon fill="#fff" points="10,5 11.12,8.45 14.76,8.45 11.82,10.59 12.94,14.05 10,11.91 7.06,14.05 8.18,10.59 5.24,8.45 8.88,8.45"/>
        </svg>
        <div class="cifras">1:00<span>PM</span></div>
        <small>HORA CHILE</small>
      </div>
    </div>

    <p class="deseo"><span class="luces" aria-hidden="true"><i></i><i></i><i></i></span>¡Le deseamos muchos éxitos en su competición!</p>
  </section>

  <svg class="capa grano" width="1080" height="1350" aria-hidden="true">
    <filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#ruido)"/>
  </svg>
</main>
<script>
  // El nombre ocupa exactamente el ancho de la ficha.
  document.fonts.ready.then(() => {
    const nombre = document.querySelector('.nombre');
    const texto = nombre.querySelector('span');
    const base = parseFloat(getComputedStyle(nombre).fontSize);
    nombre.style.fontSize = (base * nombre.clientWidth / texto.getBoundingClientRect().width) + 'px';
    document.body.dataset.listo = '1';
  });
</script>
</body>
</html>
